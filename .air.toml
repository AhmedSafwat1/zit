# Live reload for cmd/api. `make dev` (API) / `make dev-worker` (worker).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = "./tmp/api"
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "bin", "docs", "migrations", "internal/mocks", "internal/modules/user/tests/mocks"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "3s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true
  time = false

[misc]
  clean_on_exit = true
