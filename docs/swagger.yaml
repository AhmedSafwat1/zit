basePath: /api/v1
definitions:
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.Identity:
    properties:
      email:
        example: admin@rawazin.example
        type: string
      nickname:
        example: شركة روازن الدولية
        type: string
      sub:
        example: "355646255235338042"
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse:
    properties:
      identity:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.Identity'
      is_admin:
        example: true
        type: boolean
      is_sub_account:
        example: true
        type: boolean
      main_account:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccount'
      ok:
        example: true
        type: boolean
      roles:
        example:
        - ADMIN
        - jawaly_ai_super_admin
        items:
          type: string
        type: array
      sub_account_of:
        example:
        - "355646368934527195"
        - "355646755028599003"
        items:
          type: string
        type: array
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccount:
    properties:
      account_id:
        example: "1"
        type: string
      allowed:
        example: true
        type: boolean
      status_name:
        example: Active
        type: string
      sub_accounts_count:
        example: 34
        type: integer
    type: object
  github_com_4jawaly_identity-gateway_internal_response.DebugInfo:
    properties:
      cause:
        example: 'dial tcp: connection refused'
        type: string
      stack:
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
      meta:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
      success:
        type: boolean
    type: object
  github_com_4jawaly_identity-gateway_internal_response.ErrorBody:
    properties:
      code:
        example: TOKEN_INACTIVE
        type: string
      debug:
        allOf:
        - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.DebugInfo'
        description: Debug is present only for 5xx responses when APP_DEBUG=true.
          Never enable in production.
      details:
        additionalProperties: {}
        type: object
      message:
        example: token is expired or revoked
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_response.Meta:
    properties:
      cached:
        example: true
        type: boolean
      page:
        example: 1
        type: integer
      per_page:
        example: 20
        type: integer
      total:
        example: 120
        type: integer
      total_pages:
        example: 6
        type: integer
    type: object
info:
  contact: {}
  description: Authentication gateway in front of Zitadel.
  title: Identity Gateway API
  version: "1.0"
paths:
  /users/introspect:
    post:
      consumes:
      - application/json
      description: Validates the token against Zitadel (cached in Redis) and returns
        the identity report. A suspended account still returns the report alongside
        ACCOUNT_SUSPENDED.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse'
                meta:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse'
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "429":
          description: RATE_LIMITED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Introspect a bearer token
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
