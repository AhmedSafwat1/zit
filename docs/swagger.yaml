basePath: /api/v1
definitions:
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.Identity:
    properties:
      email:
        example: admin@rawazin.example
        type: string
      nickname:
        example: شركة روازن الدولية
        type: string
      sub:
        example: "355646255235338042"
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse:
    properties:
      identity:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.Identity'
      is_admin:
        example: true
        type: boolean
      is_sub_account:
        example: true
        type: boolean
      main_account:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccount'
      ok:
        example: true
        type: boolean
      roles:
        example:
        - ADMIN
        - jawaly_ai_super_admin
        items:
          type: string
        type: array
      sub_account_of:
        example:
        - "355646368934527195"
        - "355646755028599003"
        items:
          type: string
        type: array
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccount:
    properties:
      account_id:
        example: "1"
        type: string
      allowed:
        example: true
        type: boolean
      status_name:
        example: Active
        type: string
      sub_accounts_count:
        example: 34
        type: integer
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccountPayload:
    properties:
      account_id:
        type: string
      account_type_name:
        type: string
      allowed:
        type: boolean
      status_name:
        type: string
      sub_accounts_count:
        type: integer
    type: object
  github_com_4jawaly_identity-gateway_internal_modules_user_dto.UserResponse:
    properties:
      email:
        example: admin@rawazin.example
        type: string
      is_admin:
        example: true
        type: boolean
      is_placeholder:
        example: false
        type: boolean
      is_sub_account:
        example: false
        type: boolean
      main_account:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.MainAccountPayload'
      nickname:
        example: شركة روازن الدولية
        type: string
      roles:
        example:
        - ADMIN
        items:
          type: string
        type: array
      sub:
        example: "355646255235338042"
        type: string
      sub_account_of:
        example:
        - "355646368934527195"
        items:
          type: string
        type: array
      synced_at:
        example: "2026-09-14T10:00:00Z"
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_response.DebugInfo:
    properties:
      cause:
        example: 'dial tcp: connection refused'
        type: string
      stack:
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
      meta:
        $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
      success:
        type: boolean
    type: object
  github_com_4jawaly_identity-gateway_internal_response.ErrorBody:
    properties:
      code:
        example: TOKEN_INACTIVE
        type: string
      debug:
        allOf:
        - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.DebugInfo'
        description: Debug is present only when APP_DEBUG=true. Never enable in production.
      details:
        additionalProperties: {}
        type: object
      message:
        example: token is expired or revoked
        type: string
    type: object
  github_com_4jawaly_identity-gateway_internal_response.Meta:
    properties:
      cached:
        example: true
        type: boolean
      page:
        example: 1
        type: integer
      per_page:
        example: 20
        type: integer
      total:
        example: 120
        type: integer
      total_pages:
        example: 6
        type: integer
    type: object
info:
  contact: {}
  description: Authentication gateway in front of Zitadel.
  title: Identity Gateway API
  version: "1.0"
paths:
  /users:
    get:
      description: Paginated list of synced users. Requires the ADMIN role.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.UserResponse'
                  type: array
                meta:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: FORBIDDEN, ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "422":
          description: VALIDATION_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /users/{sub}:
    get:
      description: Returns one synced user by Zitadel subject. Requires the ADMIN
        role.
      parameters:
      - description: Zitadel subject
        example: "355646255235338042"
        in: path
        name: sub
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.UserResponse'
                meta:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: FORBIDDEN, ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "404":
          description: NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
  /users/{sub}/sub-accounts:
    get:
      description: Returns the users that declare {sub} as one of their main accounts.
      parameters:
      - description: Zitadel subject of the parent
        example: "355646368934527195"
        in: path
        name: sub
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.UserResponse'
                  type: array
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "404":
          description: NOT_FOUND
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List sub-accounts
      tags:
      - users
  /users/introspect:
    post:
      consumes:
      - application/json
      description: Validates the token against Zitadel (cached in Redis) and returns
        the identity report. A suspended account still returns the report alongside
        ACCOUNT_SUSPENDED.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse'
                meta:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.IntrospectResponse'
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "429":
          description: RATE_LIMITED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Introspect a bearer token
      tags:
      - users
  /users/me:
    get:
      description: Returns the synced user row of the authenticated caller.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_modules_user_dto.UserResponse'
                meta:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Meta'
              type: object
        "401":
          description: TOKEN_MISSING, TOKEN_INVALID, TOKEN_INACTIVE, ISSUER_MISMATCH
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "403":
          description: ACCOUNT_SUSPENDED
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "404":
          description: NOT_FOUND (not synced yet)
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "500":
          description: INTERNAL_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
        "503":
          description: ZITADEL_UNAVAILABLE
          schema:
            allOf:
            - $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_4jawaly_identity-gateway_internal_response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
